name: 'Thermochemistry Lint'
on: [push, pull_request, workflow_dispatch]

jobs:
  file-changes:
    name: Detect File Changes
    runs-on: 'ubuntu-latest'
    outputs: 
      checkall: ${{ steps.changes.outputs.checkall }}
    steps:
      - name: Clone
        uses: actions/checkout@v4
      - name: Detect Changes
        uses: dorny/paths-filter@v3
        id: changes
        with: 
          filters: ".github/file-filter.yml"
  
  thermochem-lint:
    name: Thermochemistry Lint
    if: needs.file-changes.outputs.checkall == 'true'
    needs: file-changes
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Install Dependencies from pyproject.toml
        run: |
          # Install the toolchain dependencies which include cantera and pyrometheus
          pip install -e ./toolchain/
          
          # Alternative approach: Extract and install specific packages
          # This reads the pyproject.toml and installs cantera and pyrometheus with their specified versions
          python3 -c "
          import tomllib
          import subprocess
          import sys
          
          with open('toolchain/pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          
          dependencies = data.get('project', {}).get('dependencies', [])
          
          # Find cantera and pyrometheus dependencies
          target_packages = ['cantera', 'pyrometheus']
          packages_to_install = []
          
          for dep in dependencies:
              for pkg in target_packages:
                  if dep.startswith(pkg):
                      packages_to_install.append(dep)
                      print(f'Found {pkg} dependency: {dep}')
                      break
          
          if packages_to_install:
              cmd = [sys.executable, '-m', 'pip', 'install'] + packages_to_install + ['numpy']
              print(f'Installing: {\" \".join(packages_to_install)} numpy')
              subprocess.run(cmd, check=True)
          else:
              print('No cantera/pyrometheus found in pyproject.toml, installing defaults')
              subprocess.run([sys.executable, '-m', 'pip', 'install', 'cantera', 'pyrometheus', 'numpy'], check=True)
          "
      
      - name: Generate Test Thermochemistry
        run: |
          python3 -c "
          import sys
          import cantera as ct
          import pyrometheus as pyro
          
          print('Successfully imported cantera and pyrometheus')
          print(f'Cantera version: {ct.__version__}')
          print(f'Pyrometheus version: {pyro.__version__}')
          
          # Use the default h2o2.yaml case (like your fallback logic)
          try:
              solution = ct.Solution('h2o2.yaml')
              print(f'Loaded solution with {solution.n_species} species')
          except Exception as e:
              print(f'Error loading h2o2.yaml: {e}')
              # Try with full path or different mechanism file
              solution = ct.Solution('gri30.yaml')
              print(f'Loaded GRI30 solution with {solution.n_species} species')
          
          # Generate using single precision (like your code does)
          real_type = 'real(sp)'
          
          # Generate the code using your existing logic
          generated_code = pyro.FortranCodeGenerator().generate(
              'm_thermochem',
              solution,
              pyro.CodeGenerationOptions(scalar_type=real_type)
          )
          
          # Write to test file
          with open('test_thermochem.f90', 'w') as f:
              f.write(generated_code)
          
          print('Generated thermochemistry code successfully')
          print(f'Generated {len(generated_code)} characters of Fortran code')
          "
      
      - name: Check for Raw ACC Directives
        run: |
          if grep -H '!\$acc' test_thermochem.f90; then
            echo "❌ Found raw ACC directives in generated thermochemistry code!"
            echo "Problematic lines:"
            grep -n '!\$acc' test_thermochem.f90
            exit 1
          else
            echo "✅ No raw ACC directives found in generated code"
          fi
      
      - name: Check for Raw OMP Directives
        run: |
          if grep -H '!\$omp' test_thermochem.f90; then
            echo "❌ Found raw OMP directives in generated thermochemistry code!"
            echo "Problematic lines:"
            grep -n '!\$omp' test_thermochem.f90
            exit 1
          else
            echo "✅ No raw OMP directives found in generated code"
          fi
      
      - name: Show Generated Code Sample
        if: always()
        run: |
          echo "First 50 lines of generated code:"
          head -50 test_thermochem.f90
          echo ""
          echo "Generated file size:"
          wc -l test_thermochem.f90
      
      - name: Archive Generated Code
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-thermochem-code
          path: test_thermochem.f90
